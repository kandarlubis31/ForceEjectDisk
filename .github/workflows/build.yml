name: Build EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build ForceEjectDisk.exe
        run: python -m PyInstaller --noconfirm --clean ForceEjectDisk.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForceEjectDisk-exe
          path: dist/ForceEjectDisk.exe
          if-no-files-found: error

      - name: Attach EXE to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ForceEjectDisk.exe
          # kalau EXE sudah dilampirkan manual, timpa saja aset yang namanya sama
          overwrite_files: true
